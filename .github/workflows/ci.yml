name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Unit tests
        run: |
          set -o pipefail
          device="$(xcrun simctl list devices available | grep -E '^ +iPhone [0-9]+ Pro Max \(' | tail -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')"
          xcodebuild test \
            -project WildCall.xcodeproj -scheme WildCall \
            -destination "id=$device" -derivedDataPath build/DerivedData \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath build/results/unit.xcresult | tail -200
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: build/results

  screenshots:
    name: App Store screenshots
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Capture
        run: |
          set -o pipefail
          Tools/screenshots/capture.sh 2>&1 | tail -300
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: build/screenshots
          if-no-files-found: warn
      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-results
          path: build/results
