name: WildCall

include:
  - Local.yml

options:
  bundleIdPrefix: com.octiplex
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: fr
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES

packages:
  WildCallCore:
    path: WildCallCore

targets:
  WildCall:
    type: application
    platform: iOS
    sources:
      - path: WildCall
      - path: Packs
        type: folder
        optional: true
        buildPhase: resources
    dependencies:
      - target: WildCallExtension
        embed: true
      - target: WildCallExtension2
        embed: true
      - target: WildCallExtension3
        embed: true
      - target: WildCallExtension4
        embed: true
      - package: WildCallCore
        product: WildCallCoreApp
      - package: WildCallCore
        product: WildCallCoreShared
    info:
      path: Generated/WildCall-Info.plist
      properties:
        CFBundleDisplayName: WildCall
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.octiplex.wildcall.refresh
        CFBundleLocalizations:
          - fr
          - en
          - it
          - es
          - pt
        CFBundleDevelopmentRegion: fr
        CFBundleDocumentTypes:
          - CFBundleTypeName: WildCall Pack
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.octiplex.wildcall.pack
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.octiplex.wildcall.pack
            UTTypeConformsTo:
              - public.data
            UTTypeDescription: WildCall Pack
            UTTypeTagSpecification:
              public.filename-extension:
                - wildcallpack
    entitlements:
      path: Generated/WildCall.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.octiplex.wildcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octiplex.wildcall
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  # iOS caps a Call Directory extension at 1 999 999 entries (measured).
  # Four identical extensions, distinguished by WildCallSlot, give ~8 M.
  # Slot 1 keeps the original bundle id so existing installs stay enabled.
  WildCallExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WildCallExtension
    dependencies:
      - package: WildCallCore
        product: WildCallCoreShared
      - sdk: CallKit.framework
    info:
      path: Generated/WildCallExtension-Info.plist
      properties:
        CFBundleDisplayName: WildCall 1
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WildCallSlot: 1
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Generated/WildCallExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.octiplex.wildcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octiplex.wildcall.directory
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  WildCallExtension2:
    type: app-extension
    platform: iOS
    sources:
      - path: WildCallExtension
    dependencies:
      - package: WildCallCore
        product: WildCallCoreShared
      - sdk: CallKit.framework
    info:
      path: Generated/WildCallExtension2-Info.plist
      properties:
        CFBundleDisplayName: WildCall 2
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WildCallSlot: 2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Generated/WildCallExtension2.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.octiplex.wildcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octiplex.wildcall.directory2
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  WildCallExtension3:
    type: app-extension
    platform: iOS
    sources:
      - path: WildCallExtension
    dependencies:
      - package: WildCallCore
        product: WildCallCoreShared
      - sdk: CallKit.framework
    info:
      path: Generated/WildCallExtension3-Info.plist
      properties:
        CFBundleDisplayName: WildCall 3
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WildCallSlot: 3
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Generated/WildCallExtension3.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.octiplex.wildcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octiplex.wildcall.directory3
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  WildCallExtension4:
    type: app-extension
    platform: iOS
    sources:
      - path: WildCallExtension
    dependencies:
      - package: WildCallCore
        product: WildCallCoreShared
      - sdk: CallKit.framework
    info:
      path: Generated/WildCallExtension4-Info.plist
      properties:
        CFBundleDisplayName: WildCall 4
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WildCallSlot: 4
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: Generated/WildCallExtension4.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.octiplex.wildcall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octiplex.wildcall.directory4
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  WildCall:
    build:
      targets:
        WildCall: all
        WildCallExtension: all
        WildCallExtension2: all
        WildCallExtension3: all
        WildCallExtension4: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: WildCallCore/WildCallCoreSharedTests
        - package: WildCallCore/WildCallCoreAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
